name: Weekly decision cycle (Monday pre-open)

# THE ONLY WORKFLOW THAT SPENDS MONEY.
#
# Monday, 08:00 New York - 90 minutes before the opening bell. Orders are
# market/day, so they fill at that morning's open at a price nobody knows when
# the decision is made.
#
# It used to run Friday after the close, on the reasoning that a whole weekend
# to notice a bad cycle was worth having. Two things killed that:
#
#   * Nobody reviews it. The brief asks for a system that runs unattended, and
#     it does - so the review window was a cost paid for a check never made.
#   * News reached the prompt AFTER this schedule was written. Deciding on
#     Friday now means deciding without the weekend's news, which is exactly
#     when takeovers and geopolitics land. That was free when the model could
#     not see news. It is not free now.
#
# Still outside market hours: a 15-minute-delayed data feed has no business
# trading against live prices. run_cycle.py refuses to submit on a day the
# market is closed - some Mondays are holidays.
on:
  # No GitHub cron. It is not that it fires late - it barely fires at all: one
  # scheduled run in this repository's entire history, six and a half hours
  # behind its slot. The trigger is now an external cron calling the
  # workflow_dispatch API, which arrives on time.
  #
  # Keeping GitHub's schedule as a "backstop" would have been worse than
  # useless. A backstop that fires once in a lifetime is not redundancy, and
  # two live triggers on one morning is a second set of orders.
  #
  # run_cycle.py refuses a second cycle on a day that already has a decision
  # record, so a repeat is safe rather than merely unlikely.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - propose and validate, submit nothing"
        type: boolean
        default: true

# Never let two cycles run at once. Two concurrent runs would each read the
# same cash balance and each commit against it.
concurrency:
  group: portfolio-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the decision cycle
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ vars.APCA_API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # A manual run defaults to DRY. Only the schedule goes live, so
        # clicking "Run workflow" without reading the form cannot place orders.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            echo "LIVE cycle - orders will be submitted"
            python scripts/run_cycle.py --live
          else
            echo "DRY RUN - nothing will be submitted"
            python scripts/run_cycle.py
          fi

      - name: Refresh state after trading
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ vars.APCA_API_BASE_URL }}
        run: python scripts/update_state.py --scheduled

      - name: Commit the decision record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ config/inception.json 2>/dev/null || git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed - no cycle output to commit."
            exit 0
          fi
          git commit -m "data: decision cycle $(date -u +%Y-%m-%d)"
          git push

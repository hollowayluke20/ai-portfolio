name: Daily state and sell triggers

# 16:25 in the MARKET's own timezone, not ours. The US and UK change clocks on
# different dates, so pinning to Europe/London would drift for a week each
# autumn; pinning to New York means "25 minutes after the closing bell" is
# always true. :25 rather than :00 dodges the load spike GitHub warns about.
on:
  schedule:
    - cron: '25 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:

# Never let two runs push at once (ADR 0002).
concurrency:
  group: portfolio-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs the mechanical sell triggers as well as refreshing state. The
      # stop loss and concentration trim are pure arithmetic on data already
      # fetched - no AI call, no cost. Running them only on the weekly cycle
      # made them far weaker than ADR 0003 claims: a holding could fall 35% on
      # a Tuesday and sit there until Friday evening.
      #
      # The AI's decisions stay weekly (weekly-cycle.yml). Judgement does not
      # improve by exercising it more often against delayed data. Reacting to
      # a position already past its stop does.
      - name: Refresh state and run the sell triggers
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ vars.APCA_API_BASE_URL }}
        run: python scripts/run_triggers.py --live

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history.json data/decisions/ 2>/dev/null || git add data/state.json data/history.json
          if git diff --staged --quiet; then
            echo "No change in portfolio state - nothing to commit."
            exit 0
          fi
          git commit -m "data: portfolio state $(date -u +%Y-%m-%d)"
          git push
